name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsnappy-dev ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', '**/*.cpp', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBUILD_EXAMPLES=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build --verbose -j$(nproc) 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          ccache -s
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== BUILD FAILED (exit $BUILD_EXIT) ==="
            echo "--- Last 100 lines of build.log ---"
            tail -n 100 build.log
            echo "=== END BUILD LOG ==="
            exit $BUILD_EXIT
          fi

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Run integration tests (verbose)
        run: ./build/tests/integration_tests

  docker-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Docker test suite
        run: |
          ./scripts/docker-test.sh full
