name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================================
  # Build & Test Matrix (Compilers x OS)
  # ============================================================
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux + GCC
          - os: ubuntu-22.04
            compiler: gcc
            cxx: g++
            build_type: Release
            test_filter: ''
          - os: ubuntu-22.04
            compiler: gcc
            cxx: g++
            build_type: Debug
            test_filter: ''
          # Linux + Clang 15
          - os: ubuntu-22.04
            compiler: clang-15
            cxx: clang++-15
            build_type: Release
            test_filter: ''
          # macOS + Clang (Apple Silicon & Intel)
          - os: macos-latest
            compiler: clang
            cxx: clang++
            build_type: Release
            test_filter: '-R unit\\.'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsnappy-dev ccache
          if [ "${{ matrix.compiler }}" = "clang-15" ]; then
            sudo apt-get install -y clang-15
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake snappy ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/Library/Caches/ccache
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', '**/*.cpp', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-
            ${{ runner.os }}-${{ matrix.compiler }}-
            ${{ runner.os }}-

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            -DBUILD_EXAMPLES=ON \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build -j$(sysctl -n hw.ncpu 2>/dev/null || nproc 2>/dev/null || echo 4)
          ccache -s

      - name: Run tests
        run: ctest --test-dir build --output-on-failure ${{ matrix.test_filter }}

  # ============================================================
  # Sanitizer Matrix (unit tests only -- integration tests are
  # timing-sensitive and often timeout under sanitizers)
  # ============================================================
  sanitizer:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan, ubsan]
        include:
          - sanitizer: asan
            cmake_flags: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
              -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          - sanitizer: tsan
            cmake_flags: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
              -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          - sanitizer: ubsan
            cmake_flags: >-
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer"
              -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer"
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"

    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.continue_on_error == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsnappy-dev ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-sanitizer-${{ matrix.sanitizer }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', '**/*.cpp', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-sanitizer-${{ matrix.sanitizer }}-
            ${{ runner.os }}-sanitizer-

      - name: Configure
        run: |
          cmake -B build ${{ matrix.cmake_flags }} \
            -DBUILD_TESTING=ON \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build -j$(nproc)
          ccache -s

      - name: Run unit tests
        run: ctest --test-dir build -R "unit\\." --output-on-failure

  # ============================================================
  # Werror Build (Treat Warnings as Errors)
  # ============================================================
  werror:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsnappy-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBUILD_EXAMPLES=ON \
            -DCMAKE_CXX_FLAGS="-Werror"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # ============================================================
  # Code Formatting Check
  # ============================================================
  format-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          clang-format --version

      - name: Check formatting
        run: |
          find src tests benchmark example include -type f \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
            -exec clang-format --dry-run --Werror --style=file {} +

  # ============================================================
  # Docker Integration Test
  # ============================================================
  docker-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Docker test suite
        run: |
          ./scripts/docker-test.sh full
